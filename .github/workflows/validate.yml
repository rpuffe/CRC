name: validate-site

# Pre-merge gate: runs the same validate.sh that CodeBuild runs in pre_build,
# but here on the PR — so broken assets / junk files / truncated HTML are
# caught before they reach main, with no AWS credentials involved.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "scripts/validate.sh"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "scripts/validate.sh"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build static site
        run: |
          npm ci
          npm run build

      - name: Validate static site
        env:
          # Keep in parity with the CloudFormation ExpectedContent parameter.
          EXPECTED_CONTENT: "Robert"
          SRC_DIR: dist
        run: bash scripts/validate.sh

      - name: Lint shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
